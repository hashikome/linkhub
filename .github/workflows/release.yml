name: Release ntumie.
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Promote to the prepared production Dokploy Stacks
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ntumie-release
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/verify.yml
  image-check:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.14 }
      - run: bun install --frozen-lockfile
      - run: docker build -f apps/api/Dockerfile -t release-check .
      - run: docker build -f apps/web/Dockerfile -t web-release-check .
      - run: bun run verify:release-image -- release-check web-release-check
  image:
    needs: image-check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.inputs.outputs.api }}
      web: ${{ steps.inputs.outputs.web }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image names
        id: name
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          echo "api=ghcr.io/${REPOSITORY,,}/api" >> "$GITHUB_OUTPUT"
          echo "web=ghcr.io/${REPOSITORY,,}/web" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.name.outputs.api }}:${{ github.sha }}
          provenance: true
          sbom: true
      - uses: docker/build-push-action@v6
        id: web
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.name.outputs.web }}:${{ github.sha }}
          provenance: true
          sbom: true
      - name: Record immutable release inputs
        id: inputs
        env:
          API_IMAGE: ${{ steps.name.outputs.api }}:${{ github.sha }}@${{ steps.build.outputs.digest }}
          WEB_IMAGE: ${{ steps.name.outputs.web }}:${{ github.sha }}@${{ steps.web.outputs.digest }}
        run: |
          printf 'API_IMAGE=%s\nWEB_IMAGE=%s\nRELEASE_SHA=%s\n' "$API_IMAGE" "$WEB_IMAGE" "$GITHUB_SHA" > release-inputs.txt
          cat release-inputs.txt >> "$GITHUB_STEP_SUMMARY"
          printf 'api=%s\nweb=%s\n' "$API_IMAGE" "$WEB_IMAGE" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ntumie-release-inputs
          path: release-inputs.txt
          retention-days: 90
  deploy:
    needs: image
    if: github.ref == 'refs/heads/main' && inputs.deploy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.14 }
      - name: Validate secret provider
        env:
          SECRETS_PROVIDER: ${{ vars.SECRETS_PROVIDER || 'github' }}
        run: |
          case "$SECRETS_PROVIDER" in
            github|1password) ;;
            *) echo 'Unsupported SECRETS_PROVIDER; use github or 1password' >&2; exit 1 ;;
          esac
      - name: Load deployment credential from GitHub
        if: vars.SECRETS_PROVIDER != '1password'
        env:
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
        run: |
          python3 - <<'PYTHON'
          import os
          key = os.environ['DOKPLOY_API_KEY']
          if not key or any(c in key for c in '\r\n\0'):
              raise SystemExit('DOKPLOY_API_KEY must be a nonempty single-line credential')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('DOKPLOY_API_KEY=' + key + '\n')
          PYTHON
      - name: Load deployment credential from 1Password
        if: vars.SECRETS_PROVIDER == '1password'
        uses: 1password/load-secrets-action@eb2efd0703da22a93c467f2d1ffbb6826c11e19c # v4
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          DOKPLOY_API_KEY: ${{ vars.OP_DOKPLOY_KEY_REF }}
      - name: Migrate, verify grants, then promote application images
        env:
          GH_TOKEN: ${{ github.token }}
          API_IMAGE: ${{ needs.image.outputs.api }}
          WEB_IMAGE: ${{ needs.image.outputs.web }}
          DOKPLOY_APPLICATION_ID: ${{ vars.DOKPLOY_APPLICATION_ID }}
          DOKPLOY_MIGRATION_ID: ${{ vars.DOKPLOY_MIGRATION_ID }}
          DOKPLOY_REGISTRY_ID: ${{ vars.DOKPLOY_REGISTRY_ID }}
        run: bun tooling/release.ts
