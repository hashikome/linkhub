version: '3.8'
services:
  api:
    # Full SHA tag AND digest, supplied by the release workflow/operator.
    image: ${API_IMAGE:?API_IMAGE_required}
    environment:
      NODE_ENV: production
      PORT: '4000'
      RELEASE_SHA: ${RELEASE_SHA:?RELEASE_SHA_required}
      RELEASE_ATTEMPT: ${RELEASE_ATTEMPT:?RELEASE_ATTEMPT_required}
      DATABASE_URL_FILE: /run/secrets/database_url
      BETTER_AUTH_SECRET_FILE: /run/secrets/auth_secret
      EMAIL_SUPPRESSION_SECRET_FILE: /run/secrets/email_suppression
      REDIS_URL_FILE: /run/secrets/redis_url
      BETTER_AUTH_URL: https://${PUBLIC_HOST:?PUBLIC_HOST_required}
      WEB_ORIGIN: https://${PUBLIC_HOST}
      WEB_SOURCE_SECRET_FILE: /run/secrets/web_source
      GOOGLE_CLIENT_ID_FILE: /run/secrets/google_client_id
      GOOGLE_CLIENT_SECRET_FILE: /run/secrets/google_client_secret
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      EMAIL_PROVIDER: resend
      EMAIL_SUPPORT_URL: ${EMAIL_SUPPORT_URL:?EMAIL_SUPPORT_URL_required}
      QUEUE_NAMESPACE: ${QUEUE_NAMESPACE:?QUEUE_NAMESPACE_required}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:?TRUSTED_PROXY_CIDRS_required}
    secrets:
      - database_url
      - auth_secret
      - email_suppression
      - redis_url
      - web_source
      - google_client_id
      - google_client_secret
    networks:
      - ingress
      - backend
      - frontend
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      replicas: ${APP_REPLICAS:-0}
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          memory: 128M
      restart_policy:
        condition: on-failure
        delay: 5s
      update_config:
        parallelism: 1
        order: start-first
        failure_action: pause
      rollback_config:
        parallelism: 1
      labels:
        traefik.enable: 'true'
        traefik.swarm.network: ${INGRESS_NETWORK:?INGRESS_NETWORK_required}
        traefik.http.routers.ntumie-api.rule: Host(`${PUBLIC_HOST}`) && PathPrefix(`/api/`)
        traefik.http.routers.ntumie-api.priority: '100'
        traefik.http.routers.ntumie-api.service: ntumie-api
        traefik.http.routers.ntumie-api.entrypoints: ${HTTPS_ENTRYPOINT:?HTTPS_ENTRYPOINT_required}
        traefik.http.routers.ntumie-api.tls: 'true'
        traefik.http.routers.ntumie-api.tls.certresolver: ${TLS_RESOLVER:?TLS_RESOLVER_required}
        traefik.http.services.ntumie-api.loadbalancer.server.port: '4000'
        traefik.http.services.ntumie-api.loadbalancer.healthcheck.path: /api/v1/status
        traefik.http.services.ntumie-api.loadbalancer.healthcheck.interval: 15s
  web:
    image: ${WEB_IMAGE:?WEB_IMAGE_required}
    environment:
      NODE_ENV: production
      WEB_HOST: 0.0.0.0
      WEB_PORT: '3000'
      RELEASE_ATTEMPT: ${RELEASE_ATTEMPT}
      BETTER_AUTH_URL: https://${PUBLIC_HOST}
      WEB_ORIGIN: https://${PUBLIC_HOST}
      API_INTERNAL_ORIGIN: http://api:4000
      WEB_SOURCE_SECRET_FILE: /run/secrets/web_source
      WEB_TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:?SUPPORT_EMAIL_required}
    secrets: [web_source]
    networks: [ingress, frontend]
    read_only: true
    tmpfs: [/tmp]
    stop_grace_period: 10s
    deploy:
      replicas: ${APP_REPLICAS:-0}
      resources:
        limits: { cpus: '1.0', memory: 512M }
        reservations: { memory: 128M }
      restart_policy: { condition: on-failure, delay: 5s }
      update_config:
        parallelism: 1
        order: start-first
        failure_action: pause
      rollback_config: { parallelism: 1, order: stop-first }
      labels:
        traefik.enable: 'true'
        traefik.swarm.network: ${INGRESS_NETWORK}
        traefik.http.routers.ntumie-web.rule: Host(`${PUBLIC_HOST}`)
        traefik.http.routers.ntumie-web.priority: '10'
        traefik.http.routers.ntumie-web.service: ntumie-web
        traefik.http.routers.ntumie-web.entrypoints: ${HTTPS_ENTRYPOINT}
        traefik.http.routers.ntumie-web.tls: 'true'
        traefik.http.routers.ntumie-web.tls.certresolver: ${TLS_RESOLVER}
        traefik.http.services.ntumie-web.loadbalancer.server.port: '3000'
        traefik.http.services.ntumie-web.loadbalancer.healthcheck.path: /healthz
        traefik.http.services.ntumie-web.loadbalancer.healthcheck.interval: 15s
  email_worker:
    image: ${API_IMAGE:?API_IMAGE_required}
    command: [bun, --tsconfig-override, tsconfig.runtime.json, dist/src/email/worker.js]
    environment:
      NODE_ENV: production
      RELEASE_ATTEMPT: ${RELEASE_ATTEMPT}
      DATABASE_URL_FILE: /run/secrets/database_url
      BETTER_AUTH_SECRET_FILE: /run/secrets/auth_secret
      EMAIL_SUPPRESSION_SECRET_FILE: /run/secrets/email_suppression
      REDIS_URL_FILE: /run/secrets/redis_url
      RESEND_API_KEY_FILE: /run/secrets/resend_key
      EMAIL_PROVIDER: resend
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:?EMAIL_FROM_ADDRESS_required}
      EMAIL_SUPPORT_URL: ${EMAIL_SUPPORT_URL:?EMAIL_SUPPORT_URL_required}
      QUEUE_NAMESPACE: ${QUEUE_NAMESPACE:?QUEUE_NAMESPACE_required}
    secrets: [database_url, auth_secret, email_suppression, redis_url, resend_key]
    # Data stays internal; the worker needs outbound HTTPS to send through Resend.
    networks: [backend, egress]
    read_only: true
    tmpfs: [/tmp]
    healthcheck:
      disable: true
    stop_grace_period: 15s
    deploy:
      replicas: ${APP_REPLICAS:-0}
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
      restart_policy:
        condition: on-failure
        delay: 5s

networks:
  egress:
    driver: overlay
    attachable: false
  frontend:
    driver: overlay
    internal: true
    attachable: false
  ingress:
    external: true
    name: ${INGRESS_NETWORK}
  backend:
    external: true
    name: ${BACKEND_NETWORK:?BACKEND_NETWORK_required}
secrets:
  database_url:
    external: true
    name: ${DATABASE_URL_SECRET:?DATABASE_URL_SECRET_required}
  auth_secret:
    external: true
    name: ${AUTH_SECRET:?AUTH_SECRET_required}
  redis_url:
    external: true
    name: ${REDIS_URL_SECRET:?REDIS_URL_SECRET_required}
  resend_key:
    external: true
    name: ${RESEND_API_KEY_SECRET:?RESEND_API_KEY_SECRET_required}
  email_suppression:
    external: true
    name: ${EMAIL_SUPPRESSION_SECRET_NAME:?EMAIL_SUPPRESSION_SECRET_NAME_required}
  web_source:
    external: true
    name: ${WEB_SOURCE_SECRET_NAME:?WEB_SOURCE_SECRET_NAME_required}
  google_client_id:
    external: true
    name: ${GOOGLE_CLIENT_ID_SECRET:?GOOGLE_CLIENT_ID_SECRET_required}
  google_client_secret:
    external: true
    name: ${GOOGLE_CLIENT_SECRET_NAME:?GOOGLE_CLIENT_SECRET_NAME_required}
